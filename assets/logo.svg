<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6e40c9"/>
      <stop offset="1" stop-color="#2463eb"/>
    </linearGradient>
  </defs>
  <!-- 背景：紫→蓝渐变圆角方块 -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <!-- 终端窗口 -->
  <rect x="22" y="34" width="84" height="60" rx="10" fill="#0d1117" opacity="0.55"/>
  <!-- 标题栏四色圆点：Hermes / Tailscale / PVE / VPS -->
  <circle cx="34" cy="47" r="3.5" fill="#8957e5"/>
  <circle cx="45" cy="47" r="3.5" fill="#4c8dff"/>
  <circle cx="56" cy="47" r="3.5" fill="#f76b1c"/>
  <circle cx="67" cy="47" r="3.5" fill="#2da44e"/>
  <!-- 命令提示符 >_ -->
  <polyline points="40,64 52,76 40,88" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="58" y="72.5" width="22" height="7" rx="3.5" fill="#ffffff"/>
</svg>

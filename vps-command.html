<script>
const data = [
  // ========== Xray/V2Ray 代理部署 ==========
  { cat: "🛡 Xray / V2Ray 代理部署", items: [
    { cmd: "apt update && apt install wget curl -y", desc: "前置依赖：无 wget/curl 时先安装" },
    { cmd: "wget -N https://raw.githubusercontent.com/linuxhobby/xray-v2ray-install/main/install.sh && chmod +x install.sh && ./install.sh", desc: "一键安装 Xray/V2Ray（进入交互菜单选协议）" },
  ]},

  // ========== VPS 初始化 ==========
  { cat: "🚀 VPS 初始化 (Debian)", items: [
    { cmd: "wget -q -O /tmp/linux_tools.sh https://raw.githubusercontent.com/linuxhobby/ProxmoxVE/main/scripts/linux_tools.sh && bash /tmp/linux_tools.sh", desc: "整合工具箱三合一：Debian 13 初始化 + Tailscale 管理 + PVE 9.0 工具" },
    { cmd: "wget -q -O /tmp/debianinstall.sh https://raw.githubusercontent.com/linuxhobby/ProxmoxVE/main/scripts/debianinstall.sh && bash /tmp/debianinstall.sh", desc: "Debian 13 初始化：时区、Locale、常用工具、IPv4/IPv6 转发、BBR、清华镜像源、Docker、主机名" },
    { cmd: "wget -q -O /tmp/install_tailscale.sh https://raw.githubusercontent.com/linuxhobby/ProxmoxVE/main/network/install_tailscale.sh && bash /tmp/install_tailscale.sh", desc: "Tailscale 管理：安装、Exit Node、子网路由、BBR 加速、IPv4/IPv6 转发" },
    { cmd: "wget -q -O /tmp/openbbr.sh https://raw.githubusercontent.com/linuxhobby/ProxmoxVE/main/scripts/openbbr.sh && bash /tmp/openbbr.sh", desc: "单独开启 BBR 网络加速" },
  ]},

  // ========== PVE 9.0 工具 ==========
  { cat: "🖥 PVE 9.0 运维", items: [
    { cmd: "wget -q -O /tmp/pve-tools.sh https://raw.githubusercontent.com/linuxhobby/ProxmoxVE/main/scripts/pve-tools.sh && bash /tmp/pve-tools.sh", desc: "PVE 9.0 工具箱：换源、删订阅弹窗、内核管理、硬件直通、NVIDIA GPU、邮件通知" },
    { cmd: "wget -q -O /root/pve_source.tar.gz 'http://szrq.hkfree.work/pve-source/pve_source.tar.gz' && tar zxvf /root/pve_source.tar.gz && /root/./pve_source", desc: "PVE 换源脚本（第三方地址，非官方源，需谨慎）" },
    { cmd: "cp /usr/share/perl5/PVE/APLInfo.pm /usr/share/perl5/PVE/APLInfo.pm_back && sed -i 's|http://download.proxmox.com|https://mirrors.tuna.tsinghua.edu.cn/proxmox|g' /usr/share/perl5/PVE/APLInfo.pm", desc: "CT 模板源换为清华镜像" },
    { cmd: "sed -Ezi.bak \"s/(Ext.Msg.show\\(\\{\\s+title: gettext\\('No valid sub)/void\\(\\{ \\/\\/\\1/g\" /usr/share/javascript/proxmox-widget-toolkit/proxmoxlib.js && systemctl restart pveproxy.service", desc: "关闭 PVE 订阅弹窗" },
    { cmd: "sed -Ezi.bak \"s/(Ext.Msg.show\\(\\{\\s+title: gettext\\('No valid sub)/void\\(\\{ \\/\\/\\1/g\" /usr/share/javascript/proxmox-widget-toolkit/proxmoxlib.js && systemctl restart proxmox-backup && systemctl restart proxmox-backup-proxy", desc: "关闭 PBS 订阅弹窗" },
  ]},

  // ========== PVE 备份与恢复 ==========
  { cat: "🗄 PVE 配置备份与恢复", items: [
    { cmd: "wget -q -O /usr/local/bin/pve-backup.sh https://raw.githubusercontent.com/linuxhobby/ProxmoxVE/main/scripts/pve-backup.sh && chmod +x /usr/local/bin/pve-backup.sh", desc: "下载 PVE 配置备份脚本到 /usr/local/bin" },
    { cmd: "crontab -e  # 添加：0 3 * * 4 /usr/local/bin/pve-backup.sh", desc: "每周四凌晨 3 点自动备份 PVE 配置" },
    { cmd: "恢复流程：解压备份 → 核对 /etc/network/interfaces 网卡名（先不重启）→ 重启 pve-cluster / pvedaemon / pveproxy → 重启 ssh → reboot", desc: "PVE 配置恢复五步流程" },
  ]},

  // ========== 部署注意事项 ==========
  { cat: "⚠️ 部署注意事项", type: "info", items: [
    { label: "系统要求", desc: "Xray 脚本支持 Debian 12/13、Ubuntu 25/26；架构 x86_64 / aarch64 / armv8l / armv7l" },
    { label: "权限", desc: "所有脚本必须 root 运行（su - 或 sudo）" },
    { label: "端口", desc: "80/tcp、443/tcp、443/udp 必须可用（脚本自动配置防火墙放行）" },
    { label: "域名", desc: "只有 REALITY 系协议免域名，其余 7 种协议需已解析到本机的域名（脚本用 dig 校验）" },
    { label: "单协议", desc: "一台机器一次只能运行一种协议，重复安装会覆盖原配置" },
    { label: "版本", desc: "脚本内置 Xray 26.3.27、Caddy 2.11.4，可在脚本顶部自行修改" },
  ]},
];

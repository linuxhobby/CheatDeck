<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<title>CLI 速查工具箱</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f6f8fa; color: #1f2328;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .tabbar {
    display: flex; align-items: stretch; gap: 4px;
    padding: 10px 16px 0;
    background: #fff; border-bottom: 1px solid #d0d7de;
    flex-shrink: 0;
    overflow-x: auto;
  }
  .brand {
    display: flex; align-items: center; gap: 8px;
    font-size: 15px; font-weight: 600;
    padding-right: 16px; margin-right: 8px;
    border-right: 1px solid #d0d7de;
    white-space: nowrap;
  }
  .tab {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px 12px;
    font-size: 14px; color: #656d76;
    background: none; border: none; cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
    white-space: nowrap;
    font-family: inherit;
  }
  .tab:hover { color: #1f2328; }
  .tab.active { color: #0969da; border-bottom-color: #0969da; font-weight: 600; }
  .tab-icon {
    width: 24px; height: 24px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; flex-shrink: 0;
  }
  .icon-hermes { background: linear-gradient(135deg, #6e40c9, #8957e5); color: #fff; }
  .icon-tailscale { background: linear-gradient(135deg, #2463eb, #4c8dff); color: #fff; }
  .icon-pve { background: linear-gradient(135deg, #e54d2e, #f76b1c); color: #fff; }
  .icon-vps { background: linear-gradient(135deg, #1a7f37, #2da44e); color: #fff; }
  .tabbar-spacer { flex: 1; }
  .open-link {
    display: flex; align-items: center;
    font-size: 12px; color: #8c959f; text-decoration: none;
    padding: 0 4px;
  }
  .open-link:hover { color: #0969da; }
  .frame-wrap { flex: 1; position: relative; }
  iframe {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    border: none;
    background: transparent;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0d1117; color: #e6edf3; }
    .tabbar { background: #161b22; border-bottom-color: #30363d; }
    .brand { border-right-color: #30363d; }
    .tab { color: #8b949e; }
    .tab:hover { color: #e6edf3; }
    .tab.active { color: #58a6ff; border-bottom-color: #58a6ff; }
  }
</style>
</head>
<body>
<div class="tabbar">
  <span class="brand"><img src="assets/favicon.svg" width="22" height="22" alt="" style="border-radius:5px" /> CLI 速查工具箱</span>
  <button class="tab" data-page="hermes-command.html" data-hash="hermes">
    <span class="tab-icon icon-hermes">🤖</span>Hermes Agent
  </button>
  <button class="tab" data-page="tailscale-command.html" data-hash="tailscale">
    <span class="tab-icon icon-tailscale">🌐</span>Tailscale
  </button>
  <button class="tab" data-page="pve-command.html" data-hash="pve">
    <span class="tab-icon icon-pve">🖥</span>PVE
  </button>
  <button class="tab" data-page="vps-command.html" data-hash="vps">
    <span class="tab-icon icon-vps">📡</span>VPS 相关
  </button>
  <span class="tabbar-spacer"></span>
  <a class="open-link" id="open-standalone" href="hermes-command.html" target="_blank">独立打开 ↗</a>
</div>
<div class="frame-wrap">
  <iframe id="frame" src="hermes-command.html" title="CLI 速查内容"></iframe>
</div>
<script>
const tabs = document.querySelectorAll('.tab');
const frame = document.getElementById('frame');
const openLink = document.getElementById('open-standalone');

function activate(hash, updateUrl) {
  const target = Array.from(tabs).find(t => t.dataset.hash === hash) || tabs[0];
  tabs.forEach(t => t.classList.toggle('active', t === target));
  frame.src = target.dataset.page;
  openLink.href = target.dataset.page;
  if (updateUrl) {
    history.replaceState(null, '', '#' + target.dataset.hash);
  }
}

tabs.forEach(t => t.addEventListener('click', () => activate(t.dataset.hash, true)));
window.addEventListener('hashchange', () => activate(location.hash.slice(1), false));
activate(location.hash.slice(1), false);
</script>
</body>
</html>
